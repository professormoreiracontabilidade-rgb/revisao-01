<style>
:root{--blue:#0b3860;--dark:#092843;--bg:#eaf2fb;--green:#13804a;--red:#bf2831;--line:#d5e2ef}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#172436;background:linear-gradient(160deg,#e6f0fc,#f8fbff);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;font-weight:800;border-radius:13px;padding:12px 15px;min-height:46px}header{background:var(--blue);color:white;padding:20px max(15px,calc((100vw - 930px)/2));box-shadow:0 4px 16px #10365722}h1{font-size:clamp(21px,4vw,33px);margin:0;line-height:1.15}header p{margin:9px 0;font-size:17px}.bartrack{height:11px;background:#6e91af;border-radius:9px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:#ffce3e;transition:width .25s}.headmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;margin-top:9px}main{max-width:930px;margin:auto;padding:16px 12px 50px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:clamp(17px,3vw,30px);box-shadow:0 10px 24px #0b386016}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill{border-radius:30px;background:#dfeeff;color:var(--blue);padding:8px 13px;font-weight:900}.statement{font-size:clamp(21px,2.45vw,27px);line-height:1.48;white-space:pre-wrap;margin:20px 0 22px;font-weight:650}.answer{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;color:#172436;background:#f9fcff;border:2px solid #cadbec;border-radius:15px;margin:10px 0;padding:14px;font-size:clamp(18px,2.15vw,23px);line-height:1.36;font-weight:650}.letter{flex:0 0 40px;border-radius:10px;background:#dfebf7;padding:9px 0;text-align:center;font-weight:900}.answer:hover:not(:disabled){background:#eaf4ff;border-color:#27649a}.answer.selected{background:#e7f1ff;border-color:#135d9b}.answer.correct{background:#e1f9e9;border-color:var(--green);color:#096234}.answer.wrong{background:#ffe8ea;border-color:var(--red);color:#982129}.answer.correct .letter{background:var(--green);color:#fff}.answer.wrong .letter{background:var(--red);color:#fff}.answer:disabled{cursor:default}.feedback{margin-top:19px;padding:18px;border-radius:13px;background:#f0f7ff;border-left:6px solid var(--blue);font-size:clamp(17px,2vw,21px);line-height:1.55}.feedback strong{color:var(--blue)}.resultgood{color:var(--green);font-weight:900}.resultbad{color:var(--red);font-weight:900}.nav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin:15px 0}.nav button{font-size:16px}.primary{background:var(--blue);color:white}.secondary{background:#dce9f6;color:var(--blue)}.restart{background:#fff2dc;color:#854600}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}.small{font-size:15px;color:#586a7c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(41px,1fr));gap:7px;margin-top:17px}.grid button{min-height:39px;padding:7px 3px;background:#edf2f7;color:var(--blue);border:1px solid #dae4ee;font-weight:800}.grid button.done{background:#c8f5d9;color:#125f34}.grid button.current{outline:3px solid #e4aa18}.panel{margin-top:15px}.summary{font-size:clamp(20px,3vw,27px);line-height:1.5}.name{font-size:18px;padding:11px;border:2px solid #cbdced;border-radius:12px;width:100%;max-width:380px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:180px}.muted{color:#596a7c}.hidden{display:none!important}.checkpoint{margin:13px 0 0;padding:13px 16px;background:#fdf3d7;border:1px solid #edce80;border-radius:13px;font-size:17px}.checktext{font-weight:800}.footer{font-size:13px;color:#687990;text-align:center;padding:16px}@media(max-width:540px){header{padding:17px 13px}.nav{grid-template-columns:1fr 1fr}.nav #checkbtn{grid-column:1/-1;grid-row:1}.statement{margin-top:15px}.answer{padding:12px;gap:10px}.letter{flex-basis:36px}.tools button{font-size:14px}.card{padding:16px}}@media print{header,.nav,.tools,.grid,.actions{display:none}body{background:white}.card{box-shadow:none}}

<script>
const QUESTIONS=[{"n":1,"text":"Segundo a NBC TG Estrutura Conceitual, para que a representação das informações financeiras seja fidedigna, ela deve ser:","alts":[{"letter":"A","text":"completa, neutra e isenta de erros."},{"letter":"B","text":"relevante, tempestiva e comparável."},{"letter":"C","text":"prudente, verificável e material."},{"letter":"D","text":"uniforme, compreensível e conservadora."}],"answer":"A","comment":"<b>Comentário:</b> Representação fidedigna exige três atributos: completude, neutralidade e ausência de erro. Tempestividade, comparabilidade, verificabilidade e compreensibilidade são características de melhoria."},{"n":2,"text":"De acordo com a NBC TG Estrutura Conceitual, a informação contábil representa fidedignamente o fenômeno econômico quando é:","alts":[{"letter":"A","text":"completa, neutra e livre de erro material."},{"letter":"B","text":"comparável, verificável e tempestiva."},{"letter":"C","text":"material, prudente e conservadora."},{"letter":"D","text":"tempestiva, útil e uniforme."}],"answer":"A","comment":"<b>Comentário:</b> A banca costuma trocar características fundamentais por características de melhoria. A representação fidedigna está ligada a completar a descrição, manter neutralidade e evitar erros."},{"n":3,"text":"Segundo a NBC TG 26, ao elaborar as demonstrações contábeis, a administração deve avaliar se a entidade continuará em operação no futuro previsível. Esse pressuposto é denominado:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"competência."},{"letter":"C","text":"materialidade."},{"letter":"D","text":"compensação."}],"answer":"A","comment":"<b>Comentário:</b> As demonstrações são elaboradas sob o pressuposto da continuidade, salvo intenção de liquidar, encerrar atividades ou inexistência de alternativa realista."},{"n":4,"text":"A Cia Horizonte não pretende encerrar suas atividades e não há indícios de liquidação. Assim, suas demonstrações contábeis devem ser elaboradas com base no pressuposto da:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"caixa."},{"letter":"C","text":"prudência absoluta."},{"letter":"D","text":"compensação obrigatória."}],"answer":"A","comment":"<b>Comentário:</b> O pressuposto adequado é continuidade. Regime de caixa não é base geral para elaboração das demonstrações, e compensação não é pressuposto."},{"n":5,"text":"Sobre ativo não circulante mantido para venda, analise: I. Quando atendidos os critérios, deve ser apresentado no ativo circulante. II. As regras também se aplicam a ativo destinado a distribuição aos sócios. III. Deve ser mensurado pelo maior entre valor contábil e valor justo líquido de despesas de venda. Está correto:","alts":[{"letter":"A","text":"I, somente."},{"letter":"B","text":"I e II, somente."},{"letter":"C","text":"I, II e III."},{"letter":"D","text":"II, somente."}],"answer":"B","comment":"<b>Comentário:</b> I e II estão corretas. O erro está na III: a mensuração é pelo menor entre o valor contábil e o valor justo menos despesas de venda."},{"n":6,"text":"Uma entidade classificou um equipamento como mantido para venda. Julgue: I. Ele passa a ser apresentado separadamente no circulante. II. A depreciação deve ser interrompida. III. A mensuração inicial da classificação é pelo maior valor entre custo histórico e valor justo. Está correto:","alts":[{"letter":"A","text":"I e II, somente."},{"letter":"B","text":"I, somente."},{"letter":"C","text":"II e III, somente."},{"letter":"D","text":"I, II e III."}],"answer":"A","comment":"<b>Comentário:</b> Mantido para venda fica no circulante e deixa de ser depreciado. A mensuração é pelo menor entre valor contábil e valor justo líquido de despesas de venda, não pelo maior."},{"n":7,"text":"Relacione: a. Despesa; b. Patrimônio Líquido; c. Receita. I. Aumentos nos ativos ou reduções nos passivos que aumentam o PL. II. Reduções nos ativos ou aumentos nos passivos que reduzem o PL. III. Participação residual nos ativos após deduzir passivos. A sequência a, b e c é:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"I - III - II."},{"letter":"C","text":"II - I - III."},{"letter":"D","text":"I - II - III."}],"answer":"A","comment":"<b>Comentário:</b> Despesa reduz o PL; patrimônio líquido é a participação residual; receita aumenta o PL."},{"n":8,"text":"Conforme a Estrutura Conceitual, associe: a. Receita; b. Despesa; c. Patrimônio Líquido. I. Participação residual nos ativos depois de deduzidos os passivos. II. Aumentos nos ativos ou reduções nos passivos que elevam o PL. III. Reduções nos ativos ou aumentos nos passivos que diminuem o PL. A ordem a, b e c é:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"III - II - I."},{"letter":"C","text":"I - II - III."},{"letter":"D","text":"II - I - III."}],"answer":"A","comment":"<b>Comentário:</b> Receita aumenta o PL; despesa diminui o PL; PL é o resíduo dos ativos menos passivos."},{"n":9,"text":"A sociedade Alfa recebeu laudo indicando perda provável em ação cível, mas o valor não pode ser mensurado com confiabilidade. O tratamento adequado é:","alts":[{"letter":"A","text":"reconhecer provisão pelo maior valor estimado."},{"letter":"B","text":"reconhecer provisão pelo menor valor possível."},{"letter":"C","text":"não reconhecer provisão e divulgar como passivo contingente."},{"letter":"D","text":"não reconhecer nem divulgar."}],"answer":"C","comment":"<b>Comentário:</b> Para reconhecer provisão, é necessário obrigação presente, saída provável de recursos e estimativa confiável. Sem mensuração confiável, não se reconhece provisão; divulga-se passivo contingente."},{"n":10,"text":"A Cia Beta tem processo trabalhista com perda provável, mas os advogados afirmam que não há estimativa confiável do valor. Nas demonstrações, a companhia deve:","alts":[{"letter":"A","text":"registrar despesa e provisão."},{"letter":"B","text":"registrar ativo contingente."},{"letter":"C","text":"não reconhecer provisão e divulgar em nota explicativa."},{"letter":"D","text":"ignorar o fato por ser apenas provável."}],"answer":"C","comment":"<b>Comentário:</b> A falta de estimativa confiável impede o reconhecimento. Como há probabilidade de saída de recursos, a informação deve ser divulgada em nota como passivo contingente."},{"n":11,"text":"Na DVA, a reversão de perdas estimadas com créditos de liquidação duvidosa deve ser apresentada:","alts":[{"letter":"A","text":"em remuneração de capitais próprios."},{"letter":"B","text":"em remuneração de capitais de terceiros."},{"letter":"C","text":"em valor adicionado recebido em transferencia."},{"letter":"D","text":"em riqueza criada pela própria entidade."}],"answer":"D","comment":"<b>Comentário:</b> PECLD e sua reversão integram a primeira parte da DVA, dentro da riqueza criada pela própria entidade, como item ligado a receitas e insumos/retenções."},{"n":12,"text":"Uma empresa reconheceu reversão de perda estimada com clientes no período. Na DVA, esse valor deve compor:","alts":[{"letter":"A","text":"a primeira parte, como riqueza criada pela própria entidade."},{"letter":"B","text":"a segunda parte, como distribuição a empregados."},{"letter":"C","text":"a segunda parte, como remuneração de capital de terceiros."},{"letter":"D","text":"valor adicionado recebido em transferencia."}],"answer":"A","comment":"<b>Comentário:</b> A reversão de PECLD entra na apuração do valor adicionado gerado pela entidade, não na distribuição do valor adicionado."},{"n":13,"text":"Na DVA, o total de remuneração de capitais próprios corresponde, em regra, a:","alts":[{"letter":"A","text":"lucros retidos/prejuízo do exercício e dividendos/juros sobre capital próprio."},{"letter":"B","text":"apenas reservas de capital."},{"letter":"C","text":"apenas pagamento de empréstimos."},{"letter":"D","text":"salários, encargos e benefícios."}],"answer":"A","comment":"<b>Comentário:</b> Remuneração de capitais próprios engloba dividendos, juros sobre capital próprio e lucros retidos ou prejuízo do exercício."},{"n":14,"text":"Ao distribuir o valor adicionado, a entidade classificou dividendos e lucros retidos. Esses itens pertencem ao grupo:","alts":[{"letter":"A","text":"remuneração de capitais próprios."},{"letter":"B","text":"remuneração de capitais de terceiros."},{"letter":"C","text":"pessoal."},{"letter":"D","text":"governo."}],"answer":"A","comment":"<b>Comentário:</b> Dividendos, JCP e lucros retidos representam remuneração dos proprietarios ou manutenção do resultado no patrimônio líquido."},{"n":15,"text":"Uma loja apresentou: receita de clientes R$ 300.000; CMV, incluindo impostos recuperáveis, R$ 120.000; PECLD R$ 9.000; perda por impairment do imobilizado R$ 15.000; depreciação R$ 20.000. O valor adicionado líquido produzido é:","alts":[{"letter":"A","text":"R$ 136.000."},{"letter":"B","text":"R$ 156.000."},{"letter":"C","text":"R$ 171.000."},{"letter":"D","text":"R$ 180.000."}],"answer":"A","comment":"<b>Comentário:</b> DVA: receita 300.000 - insumos de terceiros (CMV 120.000 + PECLD 9.000 + impairment 15.000) = valor adicionado bruto 156.000. Menos depreciação 20.000 = valor adicionado líquido 136.000."},{"n":16,"text":"Uma papelaria informou: receita R$ 250.000; CMV R$ 90.000; PECLD R$ 8.000; perda por desvalorização R$ 12.000; depreciação R$ 18.000. O valor adicionado líquido produzido na DVA é:","alts":[{"letter":"A","text":"R$ 122.000."},{"letter":"B","text":"R$ 140.000."},{"letter":"C","text":"R$ 158.000."},{"letter":"D","text":"R$ 232.000."}],"answer":"A","comment":"<b>Comentário:</b> Cálculo: 250.000 - 90.000 - 8.000 - 12.000 = 140.000 de valor adicionado bruto. Subtrai depreciação de 18.000, chegando a 122.000."},{"n":17,"text":"A entidade deve divulgar passivo contingente em notas, salvo quando a possibilidade de desembolso for:","alts":[{"letter":"A","text":"remota."},{"letter":"B","text":"possível."},{"letter":"C","text":"provável."},{"letter":"D","text":"possível ou provável."}],"answer":"A","comment":"<b>Comentário:</b> Passivos contingentes possíveis são divulgados. Quando a chance de desembolso é remota, a divulgação é dispensada."},{"n":18,"text":"Uma ação judicial tem chance remota de perda, conforme avaliação jurídica. Em relação ao passivo contingente, a entidade deve:","alts":[{"letter":"A","text":"não reconhecer e, em regra, não divulgar."},{"letter":"B","text":"reconhecer provisão integral."},{"letter":"C","text":"divulgar obrigatoriamente em nota."},{"letter":"D","text":"reconhecer ativo contingente."}],"answer":"A","comment":"<b>Comentário:</b> Se a perda é remota, não há reconhecimento de provisão e, em regra, não há divulgação de passivo contingente."},{"n":19,"text":"Em 01/04/2025, a Cia Azul pagou R$ 24.000 por 6 anúncios, sendo 3 veiculados em maio e 3 em junho. Pelo regime de competência, a despesa deve ser reconhecida:","alts":[{"letter":"A","text":"R$ 24.000 em abril."},{"letter":"B","text":"R$ 12.000 em maio e R$ 12.000 em junho."},{"letter":"C","text":"R$ 12.000 em julho e R$ 12.000 em agosto."},{"letter":"D","text":"R$ 4.000 de abril a setembro."}],"answer":"B","comment":"<b>Comentário:</b> A despesa é reconhecida quando o serviço de publicidade é prestado, não no pagamento nem quando surgirem possíveis benefícios futuros."},{"n":20,"text":"Uma empresa pagou R$ 30.000 por 10 inserções publicitárias, realizadas igualmente em setembro e outubro. Pelo regime de competência, reconhece:","alts":[{"letter":"A","text":"R$ 30.000 no pagamento."},{"letter":"B","text":"R$ 15.000 em setembro e R$ 15.000 em outubro."},{"letter":"C","text":"R$ 30.000 quando aumentar o faturamento."},{"letter":"D","text":"R$ 3.000 por mês durante dez meses."}],"answer":"B","comment":"<b>Comentário:</b> Como as inserções ocorreram metade em setembro e metade em outubro, a despesa acompanha a prestação do serviço."},{"n":21,"text":"Uma empresa comprou equipamentos por R$ 60.000. O frete rodoviário normal seria R$ 3.000, mas pagou R$ 8.000 por transporte aéreo para antecipar a entrega. Instalação: R$ 2.000. Testes: R$ 4.000. O custo do imobilizado é:","alts":[{"letter":"A","text":"R$ 69.000."},{"letter":"B","text":"R$ 74.000."},{"letter":"C","text":"R$ 66.000."},{"letter":"D","text":"R$ 60.000."}],"answer":"A","comment":"<b>Comentário:</b> Entram no custo: preço, frete necessário normal, instalação e testes. O excedente do frete por urgência não é necessário para colocar o ativo em condição de uso. 60.000 + 3.000 + 2.000 + 4.000 = 69.000."},{"n":22,"text":"A Cia Norte adquiriu computadores por R$ 35.000. O frete comum custaria R$ 1.500, mas pagou R$ 4.500 por entrega expressa. Instalação R$ 800 e testes R$ 1.200. O valor registrado no imobilizado é:","alts":[{"letter":"A","text":"R$ 38.500."},{"letter":"B","text":"R$ 41.500."},{"letter":"C","text":"R$ 36.500."},{"letter":"D","text":"R$ 35.000."}],"answer":"A","comment":"<b>Comentário:</b> Somam-se os custos diretamente atribuíveis necessários: 35.000 + frete normal 1.500 + instalação 800 + testes 1.200 = 38.500. O excedente do frete expresso é despesa."},{"n":23,"text":"A empresa processou duas partes pedindo R$ 20.000 e R$ 30.000. Os advogados classificaram as chances de ganho como possível e provável, respectivamente. O ativo contingente a reconhecer é:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 20.000."},{"letter":"C","text":"R$ 30.000."},{"letter":"D","text":"R$ 50.000."}],"answer":"A","comment":"<b>Comentário:</b> Ativo contingente não é reconhecido nas demonstrações. Quando a entrada é provável, pode haver divulgação; reconhecimento só ocorre quando a realização é praticamente certa."},{"n":24,"text":"Uma entidade pede indenização de R$ 12.000 com chance remota e R$ 18.000 com chance possível. Nas demonstrações contábeis, o ativo contingente reconhecido será:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 12.000."},{"letter":"C","text":"R$ 18.000."},{"letter":"D","text":"R$ 30.000."}],"answer":"A","comment":"<b>Comentário:</b> Ativos contingentes não são reconhecidos por prudência. Chance possível ou remota não gera ativo nas demonstrações."},{"n":25,"text":"A empresa Arcus contratou exames médicos para empregados por R$ 10.000. Os empregados reembolsam 30% e a empresa arca com o restante. O impacto na DRE é:","alts":[{"letter":"A","text":"-R$ 3.000."},{"letter":"B","text":"-R$ 7.000."},{"letter":"C","text":"-R$ 10.000."},{"letter":"D","text":"zero."}],"answer":"B","comment":"<b>Comentário:</b> O gasto total é 10.000, mas 30% será suportado pelos empregados. A parcela da empresa é 70%: 7.000 de despesa."}];
const QUIZ=1, KEY='moreira_aluno_v1_quiz_'+QUIZ+'_';
const $=id=>document.getElementById(id);
const read=(k,def)=>{try{const s=localStorage.getItem(KEY+k);return s===null?def:JSON.parse(s)}catch(e){return def}};
const write=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}};
let idx=Math.min(QUESTIONS.length-1,Math.max(0,read('idx',0))),answers=read('answers',{}),checked=read('checked',{}),name=read('name',''),shownCheckpoint=read('checkpoint',0);
function save(){write('idx',idx);write('answers',answers);write('checked',checked);write('checkpoint',shownCheckpoint);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beep(good){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const t=ctx.currentTime;[0,.11].forEach((d,j)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=good?(j?830:660):(j?220:330);gain.gain.setValueAtTime(.08,t+d);gain.gain.exponentialRampToValueAtTime(.001,t+d+.17);o.connect(gain);gain.connect(ctx.destination);o.start(t+d);o.stop(t+d+.18)});setTimeout(()=>ctx.close(),550)}catch(e){}}
function stats(){let correct=0,wrong=0,answered=0,confirmed=0;QUESTIONS.forEach(q=>{if(answers[q.n])answered++;if(checked[q.n]&&answers[q.n]){confirmed++;if(answers[q.n]===q.answer)correct++;else wrong++}});return {correct,wrong,answered,confirmed,pct:(correct/QUESTIONS.length*100).toFixed(1).replace('.',',')}}
function render(){const q=QUESTIONS[idx],done=!!checked[q.n],selected=answers[q.n]||'',st=stats();$('position').textContent=`Questão ${idx+1}/${QUESTIONS.length} · Nº ${q.n}`;$('qbadge').textContent=`QUESTÃO ${q.n}`;$('range').textContent=`${QUESTIONS.length} questões`;$('statement').textContent=q.text;$('bar').style.width=(st.confirmed/QUESTIONS.length*100)+'%';$('counter').textContent=`Acertos: ${st.correct} · Erros: ${st.wrong}`;
$('choices').innerHTML=q.alts.map(a=>{const cls=done?(a.letter===q.answer?'correct':a.letter===selected?'wrong':''):(a.letter===selected?'selected':'');return `<button class="answer ${cls}" data-a="${esc(a.letter)}" ${done?'disabled':''}><span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`}).join('');
$('choices').querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{if(checked[q.n])return;answers[q.n]=btn.dataset.a;save();render()});
$('feedbackArea').innerHTML=done?`<div class="feedback"><div class="${selected===q.answer?'resultgood':'resultbad'}">${selected===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'} Gabarito: ${esc(q.answer)}</div><div style="margin-top:12px">${q.comment}</div></div>`:'';
$('checkbtn').textContent=done?'✓ Resposta conferida':'Conferir resposta';$('checkbtn').disabled=done||!selected;$('checkbtn').style.opacity=(done||!selected)?'.65':'1';$('prev').disabled=idx===0;$('next').textContent=idx===QUESTIONS.length-1?'Ver resultado ▶':'Avançar ▶';
$('grid').innerHTML=QUESTIONS.map((x,j)=>`<button class="${checked[x.n]?'done':''} ${j===idx?'current':''}" data-j="${j}" aria-label="Questão ${x.n}">${x.n}</button>`).join('');$('grid').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.j)));
if(st.confirmed>=10&&st.confirmed%10===0&&st.confirmed>shownCheckpoint){shownCheckpoint=st.confirmed;save();$('checkpoint').classList.remove('hidden');$('checkpoint').innerHTML=`<div class="checktext">📊 Parcial de ${st.confirmed} questões conferidas</div>Acertos: ${st.correct} · Erros: ${st.wrong} · Aproveitamento parcial: ${(st.correct/st.confirmed*100).toFixed(1).replace('.',',')}%`;}else{$('checkpoint').classList.add('hidden')}
}
function check(){const q=QUESTIONS[idx];if(!answers[q.n]||checked[q.n])return;checked[q.n]=true;save();beep(answers[q.n]===q.answer);render()}
function jump(j){idx=Math.max(0,Math.min(QUESTIONS.length-1,j));save();$('final').classList.add('hidden');render();window.scrollTo({top:0,behavior:'instant'})}
function advance(){if(idx===QUESTIONS.length-1){showFinal();return}jump(idx+1)}
function showFinal(){const st=stats(),box=$('final');box.classList.remove('hidden');box.innerHTML=`<h2>RESULTADO — QUIZ ${QUIZ}</h2><div class="summary"><b>Questões:</b> ${QUESTIONS.length}<br><b>Conferidas:</b> ${st.confirmed}<br><b>Acertos:</b> <span class="resultgood">${st.correct}</span><br><b>Erros:</b> <span class="resultbad">${st.wrong}</span><br><b>Aproveitamento geral:</b> ${st.pct}%</div><p class="muted">Questões ainda não conferidas são consideradas sem acerto no percentual geral.</p><label for="studentName"><b>Nome do aluno (opcional):</b></label><div><input class="name" id="studentName" maxlength="90" placeholder="Digite seu nome" value="${esc(name)}"></div><div class="actions"><button class="primary" id="share">Enviar resultado pelo WhatsApp</button><button class="secondary" id="back">Voltar às questões</button></div>`;box.querySelector('#studentName').oninput=e=>{name=e.target.value;write('name',name)};box.querySelector('#back').onclick=()=>{box.classList.add('hidden');window.scrollTo({top:0,behavior:'instant'})};box.querySelector('#share').onclick=()=>{const s=stats(),message=`Curso de Contabilidade Professor Moreira%0AQuiz ${QUIZ} — Modo Aluno%0AAluno: ${encodeURIComponent(name||'Não informado')}%0AConferidas: ${s.confirmed}/${QUESTIONS.length}%0AAcertos: ${s.correct}%0AErros: ${s.wrong}%0AAproveitamento: ${s.pct}%25`;window.open('https://wa.me/5561985323574?text='+message,'_blank','noopener,noreferrer')};box.scrollIntoView({behavior:'smooth',block:'start'})}
$('checkbtn').onclick=check;$('prev').onclick=()=>jump(idx-1);$('next').onclick=advance;$('finish').onclick=showFinal;
$('restart').onclick=()=>{if(!confirm('Deseja reiniciar todas as respostas deste quiz?'))return;idx=0;answers={};checked={};shownCheckpoint=0;save();$('final').classList.add('hidden');render();window.scrollTo(0,0)};render();
</script></body></html>
