<style>
:root{--blue:#0b3860;--dark:#092843;--bg:#eaf2fb;--green:#13804a;--red:#bf2831;--line:#d5e2ef}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#172436;background:linear-gradient(160deg,#e6f0fc,#f8fbff);min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;font-weight:800;border-radius:13px;padding:12px 15px;min-height:46px}header{background:var(--blue);color:white;padding:20px max(15px,calc((100vw - 930px)/2));box-shadow:0 4px 16px #10365722}h1{font-size:clamp(21px,4vw,33px);margin:0;line-height:1.15}header p{margin:9px 0;font-size:17px}.bartrack{height:11px;background:#6e91af;border-radius:9px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:#ffce3e;transition:width .25s}.headmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;margin-top:9px}main{max-width:930px;margin:auto;padding:16px 12px 50px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:clamp(17px,3vw,30px);box-shadow:0 10px 24px #0b386016}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill{border-radius:30px;background:#dfeeff;color:var(--blue);padding:8px 13px;font-weight:900}.statement{font-size:clamp(21px,2.45vw,27px);line-height:1.48;white-space:pre-wrap;margin:20px 0 22px;font-weight:650}.answer{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;color:#172436;background:#f9fcff;border:2px solid #cadbec;border-radius:15px;margin:10px 0;padding:14px;font-size:clamp(18px,2.15vw,23px);line-height:1.36;font-weight:650}.letter{flex:0 0 40px;border-radius:10px;background:#dfebf7;padding:9px 0;text-align:center;font-weight:900}.answer:hover:not(:disabled){background:#eaf4ff;border-color:#27649a}.answer.selected{background:#e7f1ff;border-color:#135d9b}.answer.correct{background:#e1f9e9;border-color:var(--green);color:#096234}.answer.wrong{background:#ffe8ea;border-color:var(--red);color:#982129}.answer.correct .letter{background:var(--green);color:#fff}.answer.wrong .letter{background:var(--red);color:#fff}.answer:disabled{cursor:default}.feedback{margin-top:19px;padding:18px;border-radius:13px;background:#f0f7ff;border-left:6px solid var(--blue);font-size:clamp(17px,2vw,21px);line-height:1.55}.feedback strong{color:var(--blue)}.resultgood{color:var(--green);font-weight:900}.resultbad{color:var(--red);font-weight:900}.nav{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin:15px 0}.nav button{font-size:16px}.primary{background:var(--blue);color:white}.secondary{background:#dce9f6;color:var(--blue)}.restart{background:#fff2dc;color:#854600}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}.small{font-size:15px;color:#586a7c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(41px,1fr));gap:7px;margin-top:17px}.grid button{min-height:39px;padding:7px 3px;background:#edf2f7;color:var(--blue);border:1px solid #dae4ee;font-weight:800}.grid button.done{background:#c8f5d9;color:#125f34}.grid button.current{outline:3px solid #e4aa18}.panel{margin-top:15px}.summary{font-size:clamp(20px,3vw,27px);line-height:1.5}.name{font-size:18px;padding:11px;border:2px solid #cbdced;border-radius:12px;width:100%;max-width:380px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:180px}.muted{color:#596a7c}.hidden{display:none!important}.checkpoint{margin:13px 0 0;padding:13px 16px;background:#fdf3d7;border:1px solid #edce80;border-radius:13px;font-size:17px}.checktext{font-weight:800}.footer{font-size:13px;color:#687990;text-align:center;padding:16px}@media(max-width:540px){header{padding:17px 13px}.nav{grid-template-columns:1fr 1fr}.nav #checkbtn{grid-column:1/-1;grid-row:1}.statement{margin-top:15px}.answer{padding:12px;gap:10px}.letter{flex-basis:36px}.tools button{font-size:14px}.card{padding:16px}}@media print{header,.nav,.tools,.grid,.actions{display:none}body{background:white}.card{box-shadow:none}}

<script>
const QUESTIONS=[{"n":1,"text":"Segundo a NBC TG Estrutura Conceitual, para que a representacao das informacoes financeiras seja fidedigna, ela deve ser:","alts":[{"letter":"A","text":"completa, neutra e isenta de erros."},{"letter":"B","text":"relevante, tempestiva e comparavel."},{"letter":"C","text":"prudente, verificavel e material."},{"letter":"D","text":"uniforme, compreensivel e conservadora."}],"answer":"A","comment":"<b>Comentário:<\/b> Representacao fidedigna exige tres atributos: completude, neutralidade e ausencia de erro. Tempestividade, comparabilidade, verificabilidade e compreensibilidade sao caracteristicas de melhoria."},{"n":2,"text":"De acordo com a NBC TG Estrutura Conceitual, a informacao contábil representa fidedignamente o fenomeno econômico quando e:","alts":[{"letter":"A","text":"completa, neutra e livre de erro material."},{"letter":"B","text":"comparavel, verificavel e tempestiva."},{"letter":"C","text":"material, prudente e conservadora."},{"letter":"D","text":"tempestiva, util e uniforme."}],"answer":"A","comment":"<b>Comentário:<\/b> A banca costuma trocar caracteristicas fundamentais por caracteristicas de melhoria. A representacao fidedigna esta ligada a completar a descricao, manter neutralidade e evitar erros."},{"n":3,"text":"Segundo a NBC TG 26, ao elaborar as demonstracoes contabeis, a administracao deve avaliar se a entidade continuara em operacao no futuro previsivel. Esse pressuposto e denominado:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"competencia."},{"letter":"C","text":"materialidade."},{"letter":"D","text":"compensacao."}],"answer":"A","comment":"<b>Comentário:<\/b> As demonstracoes sao elaboradas sob o pressuposto da continuidade, salvo intencao de liquidar, encerrar atividades ou inexistencia de alternativa realista."},{"n":4,"text":"A Cia Horizonte nao pretende encerrar suas atividades e nao ha indicios de liquidacao. Assim, suas demonstracoes contabeis devem ser elaboradas com base no pressuposto da:","alts":[{"letter":"A","text":"continuidade."},{"letter":"B","text":"caixa."},{"letter":"C","text":"prudencia absoluta."},{"letter":"D","text":"compensacao obrigatoria."}],"answer":"A","comment":"<b>Comentário:<\/b> O pressuposto adequado e continuidade. Regime de caixa nao e base geral para elaboracao das demonstracoes, e compensacao nao e pressuposto."},{"n":5,"text":"Sobre ativo nao circulante mantido para venda, analise: I. Quando atendidos os criterios, deve ser apresentado no ativo circulante. II. As regras tambem se aplicam a ativo destinado a distribuicao aos socios. III. Deve ser mensurado pelo maior entre valor contabil e valor justo liquido de despesas de venda. Esta correto:","alts":[{"letter":"A","text":"I, somente."},{"letter":"B","text":"I e II, somente."},{"letter":"C","text":"I, II e III."},{"letter":"D","text":"II, somente."}],"answer":"B","comment":"<b>Comentário:<\/b> I e II estao corretas. O erro esta na III: a mensuracao e pelo menor entre o valor contabil e o valor justo menos despesas de venda."},{"n":6,"text":"Uma entidade classificou um equipamento como mantido para venda. Julgue: I. Ele passa a ser apresentado separadamente no circulante. II. A depreciacao deve ser interrompida. III. A mensuracao inicial da classificacao e pelo maior valor entre custo historico e valor justo. Esta correto:","alts":[{"letter":"A","text":"I e II, somente."},{"letter":"B","text":"I, somente."},{"letter":"C","text":"II e III, somente."},{"letter":"D","text":"I, II e III."}],"answer":"A","comment":"<b>Comentário:<\/b> Mantido para venda fica no circulante e deixa de ser depreciado. A mensuracao e pelo menor entre valor contabil e valor justo liquido de despesas de venda, nao pelo maior."},{"n":7,"text":"Relacione: a. Despesa; b. Patrimonio Liquido; c. Receita. I. Aumentos nos ativos ou reducoes nos passivos que aumentam o PL. II. Reducoes nos ativos ou aumentos nos passivos que reduzem o PL. III. Participacao residual nos ativos apos deduzir passivos. A sequencia a, b e c e:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"I - III - II."},{"letter":"C","text":"II - I - III."},{"letter":"D","text":"I - II - III."}],"answer":"A","comment":"<b>Comentário:<\/b> Despesa reduz o PL; patrimonio liquido e a participacao residual; receita aumenta o PL."},{"n":8,"text":"Conforme a Estrutura Conceitual, associe: a. Receita; b. Despesa; c. Patrimonio Liquido. I. Participacao residual nos ativos depois de deduzidos os passivos. II. Aumentos nos ativos ou reducoes nos passivos que elevam o PL. III. Reducoes nos ativos ou aumentos nos passivos que diminuem o PL. A ordem a, b e c e:","alts":[{"letter":"A","text":"II - III - I."},{"letter":"B","text":"III - II - I."},{"letter":"C","text":"I - II - III."},{"letter":"D","text":"II - I - III."}],"answer":"A","comment":"<b>Comentário:<\/b> Receita aumenta o PL; despesa diminui o PL; PL e o residuo dos ativos menos passivos."},{"n":9,"text":"A sociedade Alfa recebeu laudo indicando perda provavel em acao civel, mas o valor nao pode ser mensurado com confiabilidade. O tratamento adequado e:","alts":[{"letter":"A","text":"reconhecer provisao pelo maior valor estimado."},{"letter":"B","text":"reconhecer provisao pelo menor valor possivel."},{"letter":"C","text":"nao reconhecer provisao e divulgar como passivo contingente."},{"letter":"D","text":"nao reconhecer nem divulgar."}],"answer":"C","comment":"<b>Comentário:<\/b> Para reconhecer provisao, e necessario obrigacao presente, saida provavel de recursos e estimativa confiavel. Sem mensuracao confiavel, nao se reconhece provisao; divulga-se passivo contingente."},{"n":10,"text":"A Cia Beta tem processo trabalhista com perda provavel, mas os advogados afirmam que nao ha estimativa confiavel do valor. Nas demonstracoes, a companhia deve:","alts":[{"letter":"A","text":"registrar despesa e provisao."},{"letter":"B","text":"registrar ativo contingente."},{"letter":"C","text":"nao reconhecer provisao e divulgar em nota explicativa."},{"letter":"D","text":"ignorar o fato por ser apenas provavel."}],"answer":"C","comment":"<b>Comentário:<\/b> A falta de estimativa confiavel impede o reconhecimento. Como ha probabilidade de saida de recursos, a informacao deve ser divulgada em nota como passivo contingente."},{"n":11,"text":"Na DVA, a reversao de perdas estimadas com creditos de liquidacao duvidosa deve ser apresentada:","alts":[{"letter":"A","text":"em remuneracao de capitais proprios."},{"letter":"B","text":"em remuneracao de capitais de terceiros."},{"letter":"C","text":"em valor adicionado recebido em transferencia."},{"letter":"D","text":"em riqueza criada pela propria entidade."}],"answer":"D","comment":"<b>Comentário:<\/b> PECLD e sua reversao integram a primeira parte da DVA, dentro da riqueza criada pela propria entidade, como item ligado a receitas e insumos/retencoes."},{"n":12,"text":"Uma empresa reconheceu reversao de perda estimada com clientes no periodo. Na DVA, esse valor deve compor:","alts":[{"letter":"A","text":"a primeira parte, como riqueza criada pela propria entidade."},{"letter":"B","text":"a segunda parte, como distribuicao a empregados."},{"letter":"C","text":"a segunda parte, como remuneracao de capital de terceiros."},{"letter":"D","text":"valor adicionado recebido em transferencia."}],"answer":"A","comment":"<b>Comentário:<\/b> A reversao de PECLD entra na apuracao do valor adicionado gerado pela entidade, nao na distribuicao do valor adicionado."},{"n":13,"text":"Na DVA, o total de remuneracao de capitais proprios corresponde, em regra, a:","alts":[{"letter":"A","text":"lucros retidos/prejuizo do exercicio e dividendos/juros sobre capital proprio."},{"letter":"B","text":"apenas reservas de capital."},{"letter":"C","text":"apenas pagamento de emprestimos."},{"letter":"D","text":"salarios, encargos e beneficios."}],"answer":"A","comment":"<b>Comentário:<\/b> Remuneracao de capitais proprios engloba dividendos, juros sobre capital proprio e lucros retidos ou prejuizo do exercicio."},{"n":14,"text":"Ao distribuir o valor adicionado, a entidade classificou dividendos e lucros retidos. Esses itens pertencem ao grupo:","alts":[{"letter":"A","text":"remuneracao de capitais proprios."},{"letter":"B","text":"remuneracao de capitais de terceiros."},{"letter":"C","text":"pessoal."},{"letter":"D","text":"governo."}],"answer":"A","comment":"<b>Comentário:<\/b> Dividendos, JCP e lucros retidos representam remuneracao dos proprietarios ou manutencao do resultado no patrimonio liquido."},{"n":15,"text":"Uma loja apresentou: receita de clientes R$ 300.000; CMV, incluindo impostos recuperaveis, R$ 120.000; PECLD R$ 9.000; perda por impairment do imobilizado R$ 15.000; depreciacao R$ 20.000. O valor adicionado liquido produzido e:","alts":[{"letter":"A","text":"R$ 136.000."},{"letter":"B","text":"R$ 156.000."},{"letter":"C","text":"R$ 171.000."},{"letter":"D","text":"R$ 180.000."}],"answer":"A","comment":"<b>Comentário:<\/b> DVA: receita 300.000 - insumos de terceiros (CMV 120.000 + PECLD 9.000 + impairment 15.000) = valor adicionado bruto 156.000. Menos depreciacao 20.000 = valor adicionado liquido 136.000."},{"n":16,"text":"Uma papelaria informou: receita R$ 250.000; CMV R$ 90.000; PECLD R$ 8.000; perda por desvalorizacao R$ 12.000; depreciacao R$ 18.000. O valor adicionado liquido produzido na DVA e:","alts":[{"letter":"A","text":"R$ 122.000."},{"letter":"B","text":"R$ 140.000."},{"letter":"C","text":"R$ 158.000."},{"letter":"D","text":"R$ 232.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Calculo: 250.000 - 90.000 - 8.000 - 12.000 = 140.000 de valor adicionado bruto. Subtrai depreciacao de 18.000, chegando a 122.000."},{"n":17,"text":"A entidade deve divulgar passivo contingente em notas, salvo quando a possibilidade de desembolso for:","alts":[{"letter":"A","text":"remota."},{"letter":"B","text":"possivel."},{"letter":"C","text":"provavel."},{"letter":"D","text":"possivel ou provavel."}],"answer":"A","comment":"<b>Comentário:<\/b> Passivos contingentes possiveis sao divulgados. Quando a chance de desembolso e remota, a divulgacao e dispensada."},{"n":18,"text":"Uma acao judicial tem chance remota de perda, conforme avaliacao juridica. Em relacao ao passivo contingente, a entidade deve:","alts":[{"letter":"A","text":"nao reconhecer e, em regra, nao divulgar."},{"letter":"B","text":"reconhecer provisao integral."},{"letter":"C","text":"divulgar obrigatoriamente em nota."},{"letter":"D","text":"reconhecer ativo contingente."}],"answer":"A","comment":"<b>Comentário:<\/b> Se a perda e remota, nao ha reconhecimento de provisao e, em regra, nao ha divulgacao de passivo contingente."},{"n":19,"text":"Em 01/04/2025, a Cia Azul pagou R$ 24.000 por 6 anuncios, sendo 3 veiculados em maio e 3 em junho. Pelo regime de competencia, a despesa deve ser reconhecida:","alts":[{"letter":"A","text":"R$ 24.000 em abril."},{"letter":"B","text":"R$ 12.000 em maio e R$ 12.000 em junho."},{"letter":"C","text":"R$ 12.000 em julho e R$ 12.000 em agosto."},{"letter":"D","text":"R$ 4.000 de abril a setembro."}],"answer":"B","comment":"<b>Comentário:<\/b> A despesa e reconhecida quando o servico de publicidade e prestado, nao no pagamento nem quando surgirem possiveis beneficios futuros."},{"n":20,"text":"Uma empresa pagou R$ 30.000 por 10 insercoes publicitarias, realizadas igualmente em setembro e outubro. Pelo regime de competencia, reconhece:","alts":[{"letter":"A","text":"R$ 30.000 no pagamento."},{"letter":"B","text":"R$ 15.000 em setembro e R$ 15.000 em outubro."},{"letter":"C","text":"R$ 30.000 quando aumentar o faturamento."},{"letter":"D","text":"R$ 3.000 por mes durante dez meses."}],"answer":"B","comment":"<b>Comentário:<\/b> Como as insercoes ocorreram metade em setembro e metade em outubro, a despesa acompanha a prestacao do servico."},{"n":21,"text":"Uma empresa comprou equipamentos por R$ 60.000. O frete rodoviario normal seria R$ 3.000, mas pagou R$ 8.000 por transporte aereo para antecipar a entrega. Instalacao: R$ 2.000. Testes: R$ 4.000. O custo do imobilizado e:","alts":[{"letter":"A","text":"R$ 69.000."},{"letter":"B","text":"R$ 74.000."},{"letter":"C","text":"R$ 66.000."},{"letter":"D","text":"R$ 60.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Entram no custo: preco, frete necessario normal, instalacao e testes. O excedente do frete por urgencia nao e necessario para colocar o ativo em condicao de uso. 60.000 + 3.000 + 2.000 + 4.000 = 69.000."},{"n":22,"text":"A Cia Norte adquiriu computadores por R$ 35.000. O frete comum custaria R$ 1.500, mas pagou R$ 4.500 por entrega expressa. Instalacao R$ 800 e testes R$ 1.200. O valor registrado no imobilizado e:","alts":[{"letter":"A","text":"R$ 38.500."},{"letter":"B","text":"R$ 41.500."},{"letter":"C","text":"R$ 36.500."},{"letter":"D","text":"R$ 35.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Somam-se os custos diretamente atribuiveis necessarios: 35.000 + frete normal 1.500 + instalacao 800 + testes 1.200 = 38.500. O excedente do frete expresso e despesa."},{"n":23,"text":"A empresa processou duas partes pedindo R$ 20.000 e R$ 30.000. Os advogados classificaram as chances de ganho como possivel e provavel, respectivamente. O ativo contingente a reconhecer e:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 20.000."},{"letter":"C","text":"R$ 30.000."},{"letter":"D","text":"R$ 50.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Ativo contingente nao e reconhecido nas demonstracoes. Quando a entrada e provavel, pode haver divulgacao; reconhecimento so ocorre quando a realizacao e praticamente certa."},{"n":24,"text":"Uma entidade pede indenizacao de R$ 12.000 com chance remota e R$ 18.000 com chance possivel. Nas demonstracoes contabeis, o ativo contingente reconhecido sera:","alts":[{"letter":"A","text":"zero."},{"letter":"B","text":"R$ 12.000."},{"letter":"C","text":"R$ 18.000."},{"letter":"D","text":"R$ 30.000."}],"answer":"A","comment":"<b>Comentário:<\/b> Ativos contingentes nao sao reconhecidos por prudencia. Chance possivel ou remota nao gera ativo nas demonstracoes."},{"n":25,"text":"A empresa Arcus contratou exames medicos para empregados por R$ 10.000. Os empregados reembolsam 30% e a empresa arca com o restante. O impacto na DRE e:","alts":[{"letter":"A","text":"-R$ 3.000."},{"letter":"B","text":"-R$ 7.000."},{"letter":"C","text":"-R$ 10.000."},{"letter":"D","text":"zero."}],"answer":"B","comment":"<b>Comentário:<\/b> O gasto total e 10.000, mas 30% sera suportado pelos empregados. A parcela da empresa e 70%: 7.000 de despesa."}];
const QUIZ=1, KEY='moreira_aluno_v1_quiz_'+QUIZ+'_';
const $=id=>document.getElementById(id);
const read=(k,def)=>{try{const s=localStorage.getItem(KEY+k);return s===null?def:JSON.parse(s)}catch(e){return def}};
const write=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}};
let idx=Math.min(QUESTIONS.length-1,Math.max(0,read('idx',0))),answers=read('answers',{}),checked=read('checked',{}),name=read('name',''),shownCheckpoint=read('checkpoint',0);
function save(){write('idx',idx);write('answers',answers);write('checked',checked);write('checkpoint',shownCheckpoint);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beep(good){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const t=ctx.currentTime;[0,.11].forEach((d,j)=>{const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=good?(j?830:660):(j?220:330);gain.gain.setValueAtTime(.08,t+d);gain.gain.exponentialRampToValueAtTime(.001,t+d+.17);o.connect(gain);gain.connect(ctx.destination);o.start(t+d);o.stop(t+d+.18)});setTimeout(()=>ctx.close(),550)}catch(e){}}
function stats(){let correct=0,wrong=0,answered=0,confirmed=0;QUESTIONS.forEach(q=>{if(answers[q.n])answered++;if(checked[q.n]&&answers[q.n]){confirmed++;if(answers[q.n]===q.answer)correct++;else wrong++}});return {correct,wrong,answered,confirmed,pct:(correct/QUESTIONS.length*100).toFixed(1).replace('.',',')}}
function render(){const q=QUESTIONS[idx],done=!!checked[q.n],selected=answers[q.n]||'',st=stats();$('position').textContent=`Questão ${idx+1}/${QUESTIONS.length} · Nº ${q.n}`;$('qbadge').textContent=`QUESTÃO ${q.n}`;$('range').textContent=`${QUESTIONS.length} questões`;$('statement').textContent=q.text;$('bar').style.width=(st.confirmed/QUESTIONS.length*100)+'%';$('counter').textContent=`Acertos: ${st.correct} · Erros: ${st.wrong}`;
$('choices').innerHTML=q.alts.map(a=>{const cls=done?(a.letter===q.answer?'correct':a.letter===selected?'wrong':''):(a.letter===selected?'selected':'');return `<button class="answer ${cls}" data-a="${esc(a.letter)}" ${done?'disabled':''}><span class="letter">${esc(a.letter)}</span><span>${esc(a.text)}</span></button>`}).join('');
$('choices').querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{if(checked[q.n])return;answers[q.n]=btn.dataset.a;save();render()});
$('feedbackArea').innerHTML=done?`<div class="feedback"><div class="${selected===q.answer?'resultgood':'resultbad'}">${selected===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'} Gabarito: ${esc(q.answer)}</div><div style="margin-top:12px">${q.comment}</div></div>`:'';
$('checkbtn').textContent=done?'✓ Resposta conferida':'Conferir resposta';$('checkbtn').disabled=done||!selected;$('checkbtn').style.opacity=(done||!selected)?'.65':'1';$('prev').disabled=idx===0;$('next').textContent=idx===QUESTIONS.length-1?'Ver resultado ▶':'Avançar ▶';
$('grid').innerHTML=QUESTIONS.map((x,j)=>`<button class="${checked[x.n]?'done':''} ${j===idx?'current':''}" data-j="${j}" aria-label="Questão ${x.n}">${x.n}</button>`).join('');$('grid').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>jump(Number(b.dataset.j)));
if(st.confirmed>=10&&st.confirmed%10===0&&st.confirmed>shownCheckpoint){shownCheckpoint=st.confirmed;save();$('checkpoint').classList.remove('hidden');$('checkpoint').innerHTML=`<div class="checktext">📊 Parcial de ${st.confirmed} questões conferidas</div>Acertos: ${st.correct} · Erros: ${st.wrong} · Aproveitamento parcial: ${(st.correct/st.confirmed*100).toFixed(1).replace('.',',')}%`;}else{$('checkpoint').classList.add('hidden')}
}
function check(){const q=QUESTIONS[idx];if(!answers[q.n]||checked[q.n])return;checked[q.n]=true;save();beep(answers[q.n]===q.answer);render()}
function jump(j){idx=Math.max(0,Math.min(QUESTIONS.length-1,j));save();$('final').classList.add('hidden');render();window.scrollTo({top:0,behavior:'instant'})}
function advance(){if(idx===QUESTIONS.length-1){showFinal();return}jump(idx+1)}
function showFinal(){const st=stats(),box=$('final');box.classList.remove('hidden');box.innerHTML=`<h2>RESULTADO — QUIZ ${QUIZ}</h2><div class="summary"><b>Questões:</b> ${QUESTIONS.length}<br><b>Conferidas:</b> ${st.confirmed}<br><b>Acertos:</b> <span class="resultgood">${st.correct}</span><br><b>Erros:</b> <span class="resultbad">${st.wrong}</span><br><b>Aproveitamento geral:</b> ${st.pct}%</div><p class="muted">Questões ainda não conferidas são consideradas sem acerto no percentual geral.</p><label for="studentName"><b>Nome do aluno (opcional):</b></label><div><input class="name" id="studentName" maxlength="90" placeholder="Digite seu nome" value="${esc(name)}"></div><div class="actions"><button class="primary" id="share">Enviar resultado pelo WhatsApp</button><button class="secondary" id="back">Voltar às questões</button></div>`;box.querySelector('#studentName').oninput=e=>{name=e.target.value;write('name',name)};box.querySelector('#back').onclick=()=>{box.classList.add('hidden');window.scrollTo({top:0,behavior:'instant'})};box.querySelector('#share').onclick=()=>{const s=stats(),message=`Curso de Contabilidade Professor Moreira%0AQuiz ${QUIZ} — Modo Aluno%0AAluno: ${encodeURIComponent(name||'Não informado')}%0AConferidas: ${s.confirmed}/${QUESTIONS.length}%0AAcertos: ${s.correct}%0AErros: ${s.wrong}%0AAproveitamento: ${s.pct}%25`;window.open('https://wa.me/5561985323574?text='+message,'_blank','noopener,noreferrer')};box.scrollIntoView({behavior:'smooth',block:'start'})}
$('checkbtn').onclick=check;$('prev').onclick=()=>jump(idx-1);$('next').onclick=advance;$('finish').onclick=showFinal;
$('restart').onclick=()=>{if(!confirm('Deseja reiniciar todas as respostas deste quiz?'))return;idx=0;answers={};checked={};shownCheckpoint=0;save();$('final').classList.add('hidden');render();window.scrollTo(0,0)};render();
</script></body></html>
